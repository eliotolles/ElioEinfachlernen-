        <p class="auth-art__tagline">DEUTSCH LERNEN.</p>
        <p class="auth-art__tagline auth-art__tagline--em">EINFACH DU SEIN.</p>
      </div>
    </div>
  </aside>

  <!-- Right: Form panel -->
  <main class="auth-form-panel" id="main-content">

    <!-- Mobile brand (shown only on small screens) -->
    <a href="/" class="auth-brand-mobile">
      <span class="brand-name">ELIO EINFACH</span>
    </a>

<div class="account-page-tools"><select id="account-language" aria-label="Ngôn ngữ / Sprache / Language"><option value="vi">VI</option><option value="de">DE</option><option value="en">EN</option></select><button id="account-theme" type="button" aria-label="Giao diện sáng/tối">◐</button></div>
    <!-- Tab switcher -->
    <nav class="auth-tabs" aria-label="Tài khoản"><a class="auth-tab active" data-account-tab href="login.html" aria-current="page">Anmelden</a><a class="auth-tab " data-account-tab href="register.html" >Registrieren</a></nav>

    <!-- ── LOGIN PANEL ────────────────────────────── -->
    <section class="auth-panel active" id="panel-login" aria-label="Anmelden">
      <div class="auth-panel__header">
        <h1 class="auth-panel__title">Willkommen zurück</h1>
        <p class="auth-panel__subtitle">Tiếp tục hành trình học tiếng Đức của bạn.</p>
      </div>

      <!-- Google OAuth (shown when configured) -->
      

      

      <!-- Email/Password form -->
      <form class="auth-form" id="account-form" method="post">
        <div class="form-field">
          <label class="form-label" for="account-username">Email</label>
          <div class="form-input-wrap">
            <svg class="form-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input class="form-input"
                   type="email"
                   id="account-username" maxlength="254" aria-describedby="username-help"
                   name="email"
                   autocomplete="email"
                   inputmode="email"
                   placeholder="email@beispiel.de"
                   required />
          </div>
          
        </div>

        <div class="form-field">
          <div class="form-label-row">
            <label class="form-label" for="account-password" data-account="password">Mật khẩu</label>
            
          </div>
          <div class="form-input-wrap">
            <svg class="form-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0110 0v4"/>
            </svg>
            <input class="form-input"
                   type="password"
                   id="account-password" maxlength="128" minlength="8"
                   name="password"
                   autocomplete="current-password"
                   placeholder="••••••••"
                   required />
            
          </div>
          
        </div>

        <!-- Form-level error -->
        

<small id="username-help" data-account="usernameHelp"></small><label class="account-show-password"><input id="account-show-password" type="checkbox"><span data-account="showPassword">Hiện mật khẩu</span></label><p id="account-embed-note" hidden><span id="account-embed-copy"></span> <a id="account-open-tab" target="_blank" rel="noopener"></a></p><p id="account-error" role="alert"></p><a id="account-login-existing" hidden></a>
        <button type="submit" class="btn btn--primary btn--full" id="account-submit">
          <span class="btn-label" data-account="title">Anmelden</span>
          <span class="btn-spinner" hidden aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
            </svg>
          </span>
        </button>
      </form>
    </section>

    <!-- ── REGISTER PANEL ─────────────────────────── -->
    

<p class="auth-switch"><span data-account="switchPrompt"></span> <a id="account-switch" data-account="switchLink" href="register.html"></a></p><p class="auth-account-note" data-account="localNote"></p>
    <!-- Back to landing -->
    <div class="auth-back">
      <a href="/" class="auth-back__link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path d="M19 12H5M12 5l-7 7 7 7"/>
        </svg>
        Zurück zur Startseite
      </a>
    </div>

  </main>
</div>




<script src="js/account-page.js"></script><script src="js/account-v2.js"></script></body>
</html>
